<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayback — Dig Through Time</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.25);
      --bg: #1a1612;
      --surface: #242018;
      --surface-light: #2e2a20;
      --text: #e8e0d4;
      --text-dim: #9a8f80;
      --border: #3a3528;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 3rem;
      letter-spacing: 6px;
      color: var(--accent);
      text-shadow: 0 2px 8px var(--accent-glow);
      font-weight: 400;
    }

    .header .tagline {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 12px;
      letter-spacing: 3px;
      font-style: italic;
    }

    .console {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 10px;
      box-shadow:
        0 4px 16px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .console-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    .search-row input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .search-row input:focus {
      border-color: var(--accent);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 12px var(--accent-glow);
    }

    /* 3D Button */
    .btn-3d {
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #d4b87a 0%, #c9a96e 40%, #a8884a 100%);
      color: #1a1612;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow:
        0 6px 0 #7a6530,
        0 8px 12px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3);
      transition: all 0.1s ease;
      text-shadow: 0 1px 0 rgba(255,255,255,0.2);
    }

    .btn-3d:hover {
      background: linear-gradient(180deg, #e0c488 0%, #d4b87a 40%, #b89858 100%);
      box-shadow:
        0 6px 0 #7a6530,
        0 8px 16px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-3d:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #7a6530,
        0 3px 6px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .surprise-btn {
      display: block;
      margin: 16px auto 0;
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 10px 24px;
      border-radius: 8px;
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 3px 0 var(--border), 0 4px 8px rgba(0,0,0,0.3);
    }

    .surprise-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 3px 0 var(--border), 0 4px 12px var(--accent-glow);
    }

    .surprise-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border), 0 2px 4px rgba(0,0,0,0.3);
    }

    .warp-loading {
      text-align: center;
      padding: 60px 0;
      display: none;
    }

    .warp-loading.active { display: block; }

    .warp-ring {
      width: 70px; height: 70px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: warpSpin 1.5s ease-in-out infinite;
      box-shadow: 0 0 16px var(--accent-glow), inset 0 0 12px var(--accent-glow);
    }

    @keyframes warpSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .warp-text {
      color: var(--accent);
      font-size: 0.9rem;
      letter-spacing: 3px;
      font-style: italic;
    }

    .strata {
      display: none;
      flex-direction: column;
      gap: 0;
      margin-top: 40px;
      position: relative;
    }

    .strata.active { display: flex; }

    .strata::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      opacity: 0.2;
    }

    .strata-layer {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 30px 0;
      position: relative;
      opacity: 0;
      transform: translateY(30px);
      animation: layerReveal 0.6s ease forwards;
    }

    .strata-layer:nth-child(1) { animation-delay: 0.1s; }
    .strata-layer:nth-child(2) { animation-delay: 0.3s; }
    .strata-layer:nth-child(3) { animation-delay: 0.5s; }
    .strata-layer:nth-child(4) { animation-delay: 0.7s; }
    .strata-layer:nth-child(5) { animation-delay: 0.9s; }

    @keyframes layerReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .strata-layer:nth-child(even) { flex-direction: row-reverse; }

    .strata-year {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 100px;
      text-align: center;
      text-shadow: 0 2px 6px var(--accent-glow);
    }

    .strata-connector {
      width: 40px;
      height: 2px;
      background: var(--accent);
      opacity: 0.3;
    }

    .flip-card {
      width: 260px;
      height: 180px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 14px;
      overflow: hidden;
    }

    .flip-card-front {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        0 8px 24px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .flip-card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.7) contrast(1.05) sepia(0.1);
    }

    .flip-card-front::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transition: left 0.6s;
    }

    .flip-card:hover .flip-card-front::after {
      left: 100%;
    }

    .flip-card-back {
      background: linear-gradient(145deg, var(--surface-light), var(--surface));
      border: 1px solid var(--accent);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.5),
        0 0 20px var(--accent-glow),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .flip-card-back .back-year {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .flip-card-back .back-link {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      transition: all 0.3s;
      background: var(--bg);
      box-shadow: 0 3px 0 var(--border);
    }

    .flip-card-back .back-link:hover {
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 3px 0 var(--border), 0 0 10px var(--accent-glow);
    }

    .flip-card-back .back-hint {
      color: var(--text-dim);
      font-size: 0.72rem;
      margin-top: 14px;
      font-style: italic;
    }

    .error-msg {
      text-align: center;
      color: #c98a6e;
      padding: 40px;
      font-size: 1rem;
      font-style: italic;
      display: none;
    }

    .error-msg.active { display: block; }

    .footer {
      text-align: center;
      margin-top: 60px;
      color: var(--text-dim);
      font-size: 0.75rem;
      letter-spacing: 1px;
      font-style: italic;
    }

    .footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 700px) {
      .header h1 { font-size: 2rem; }
      .strata-layer { flex-direction: column !important; gap: 15px; }
      .strata-connector { width: 2px; height: 20px; }
      .flip-card { width: 220px; height: 150px; }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="content">
    <div class="header">
      <h1>WAYBACK</h1>
      <p class="tagline">dig through the layers of the internet</p>
    </div>

    <div class="console">
      <div class="console-label">Enter a site to excavate</div>
      <div class="search-row">
        <input type="text" id="url" placeholder="e.g. flipkart.com" onkeypress="if(event.key==='Enter')dig()">
        <button class="btn-3d" onclick="dig()">DIG</button>
      </div>
      <button class="surprise-btn" onclick="surpriseMe()">Random Excavation Site</button>
    </div>

    <div class="warp-loading" id="loading">
      <div class="warp-ring"></div>
      <p class="warp-text">Warping through timeline...</p>
    </div>

    <div class="error-msg" id="error"></div>

    <div class="strata" id="strata"></div>

    <p class="footer">Data source: <a href="https://web.archive.org" target="_blank">Internet Archive / Wayback Machine</a></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('particle-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    camera.position.z = 5;

    const particleCount = 1200;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const speeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 20;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
      speeds[i] = 0.001 + Math.random() * 0.003;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.025,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    let currentEraColor = new THREE.Color(0xc9a96e);
    let targetEraColor = new THREE.Color(0xc9a96e);

    function setEraColor(hex) {
      targetEraColor.setHex(hex);
    }

    function animate() {
      requestAnimationFrame(animate);
      currentEraColor.lerp(targetEraColor, 0.015);

      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;

      for (let i = 0; i < particleCount; i++) {
        pos[i * 3 + 1] += speeds[i];
        if (pos[i * 3 + 1] > 10) pos[i * 3 + 1] = -10;

        col[i * 3]     = currentEraColor.r * (0.4 + Math.sin(i * 0.1) * 0.2);
        col[i * 3 + 1] = currentEraColor.g * (0.4 + Math.cos(i * 0.1) * 0.2);
        col[i * 3 + 2] = currentEraColor.b * (0.4 + Math.sin(i * 0.2) * 0.2);
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      particles.rotation.y += 0.0002;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const popularSites = [
      'google.com', 'twitter.com', 'youtube.com', 'facebook.com',
      'amazon.com', 'flipkart.com', 'instagram.com', 'wikipedia.org',
      'reddit.com', 'netflix.com', 'spotify.com', 'github.com',
      'myntra.com', 'swiggy.com', 'whatsapp.com'
    ];

    function getEraColor(year) {
      if (year < 2010) return 0xc9a96e;
      if (year < 2015) return 0x8faa7b;
      if (year < 2020) return 0x7b9aab;
      if (year < 2023) return 0x9a8aab;
      return 0xab8a7b;
    }

    function surpriseMe() {
      const random = popularSites[Math.floor(Math.random() * popularSites.length)];
      document.getElementById('url').value = random;
      dig();
    }

    async function dig() {
      let url = document.getElementById('url').value.trim();
      if (!url) return;

      if (!url.startsWith('http')) url = 'https://' + url;
      const hostname = new URL(url).hostname.replace('www.', '');

      const loading = document.getElementById('loading');
      const strata = document.getElementById('strata');
      const error = document.getElementById('error');

      loading.classList.add('active');
      strata.classList.remove('active');
      error.classList.remove('active');

      try {
        const apiUrl = `/api?url=` + encodeURIComponent(`https://web.archive.org/cdx/search/cdx?url=${hostname}&output=json&limit=5&filter=statuscode:200&collapse=timestamp:4`);

        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Archive unreachable');
        const data = await res.json();

        if (!data || data.length <= 1) {
          loading.classList.remove('active');
          error.textContent = `No strata found for "${hostname}". Try a larger, older site.`;
          error.classList.add('active');
          return;
        }

        const snapshots = data.slice(1).map(row => {
          const timestamp = row[1];
          const year = parseInt(timestamp.substring(0, 4));
          const originalUrl = row[2];
          const screenshotUrl = `https://web.archive.org/web/${timestamp}im_/${originalUrl}`;
          const fullUrl = `https://web.archive.org/web/${timestamp}/${originalUrl}`;
          return { year, screenshotUrl, fullUrl };
        });

        const oldestYear = snapshots[0].year;
        setEraColor(getEraColor(oldestYear));

        strata.innerHTML = snapshots.map(s => `
          <div class="strata-layer">
            <div class="strata-year">${s.year}</div>
            <div class="strata-connector"></div>
            <div class="flip-card">
              <div class="flip-card-inner">
                <div class="flip-card-front">
                  <img src="${s.screenshotUrl}" alt="${s.year}" loading="lazy"
                       onerror="this.style.display='none';this.parentElement.style.background='var(--surface)'">
                </div>
                <div class="flip-card-back">
                  <div class="back-year">${s.year}</div>
                  <a class="back-link" href="${s.fullUrl}" target="_blank">View Full Page</a>
                  <div class="back-hint">hover to flip back</div>
                </div>
              </div>
            </div>
          </div>
        `).join('');

        loading.classList.remove('active');
        strata.classList.add('active');

        setTimeout(() => strata.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

      } catch (err) {
        loading.classList.remove('active');
        error.textContent = `Excavation failed: ${err.message}. Make sure server.py is running.`;
        error.classList.add('active');
      }
    }
  </script>

</body>
</html>
